name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install Linux packages (OpenGL, X11/Wayland for SDL3, Xvfb for the tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev xvfb

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DPANG3D_TEST_VIDEO_DRIVER=x11

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (every level, 20 seconds each)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1024x768x24" ctest --test-dir build --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake --install build --config Release --prefix pkg/3dPang
          windeployqt --release --no-translations pkg/3dPang/bin/3dpang-editor.exe
          windeployqt --release --no-translations pkg/3dPang/bin/3dpang.exe
          cd pkg && 7z a ../3dPang-${{ github.ref_name }}-windows-x64.zip 3dPang

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix pkg/3dPang
          tar -C pkg -czf 3dPang-${{ github.ref_name }}-linux-x64.tar.gz 3dPang

      - name: Upload package
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: 3dPang-${{ matrix.name }}
          path: 3dPang-*.*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract the release notes from CHANGELOG.md
        run: awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: 3dPang ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
